  <!-- Cathedral Base Steps -->
  <path d="M9 53H55" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M12 57H52" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
