<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="appleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedd0" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6e1d" />
    </linearGradient>
    <radialGradient id="appleHalo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="#0c0b09" stroke="#d4af37" stroke-width="3" stroke-opacity="0.5" />
  <circle cx="90" cy="75" r="65" fill="url(#appleHalo)" />

  <!-- Outer Cathedral Arch -->
  <path d="M40 150V88C40 52 62 26 90 26C118 26 140 52 140 88V150" stroke="url(#appleGold)" stroke-width="8" stroke-linecap="round" />
  <!-- Inner Arch -->
  <path d="M58 150V94C58 66 72 50 90 50C108 50 122 66 122 94V150" stroke="url(#appleGold)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85" />
  <!-- Portal Door -->
  <path d="M74 150V114C74 100 81 90 90 90C99 90 106 100 106 114V150" stroke="url(#appleGold)" stroke-width="4" fill="#14120e" />

  <!-- Rose Window Motif -->
  <circle cx="90" cy="72" r="9" stroke="url(#appleGold)" stroke-width="3.5" fill="#0c0b09" />

  <!-- Cross at Apex -->
  <path d="M90 26V8M80 15H100" stroke="url(#appleGold)" stroke-width="5" stroke-linecap="round" />

  <!-- Steps -->
  <path d="M26 150H154" stroke="url(#appleGold)" stroke-width="7" stroke-linecap="round" />
  <path d="M35 160H145" stroke="url(#appleGold)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
